<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - PromoPing Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/images/PromoPing.png">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="header-content">
                    <img src="../assets/images/PromoPing.png" alt="PromoPing Logo" class="logo-placeholder">
                    <h4>PromoPing Suporte</h4>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Visão Geral</span>
                </a>
                <a href="utilizadores.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Utilizadores</span>
                </a>
                <a href="produtos.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Produtos</span>
                </a>
                <a href="avaliacoes.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Avaliações</span>
                </a>
                <a href="suporte.html" class="nav-item active">
                    <span class="nav-icon"></span>
                    <span>Suporte</span>
                </a>
                <a href="bugs.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Bugs & Projetos</span>
                </a>
                <a href="sugestoes.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Sugestões</span>
                </a>
                <a href="tabelas.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Incidentes</span>
                </a>
                <a href="calendar.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Calendário</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Perfil</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-button">Sair</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <section class="dashboard-section active" style="display: flex; flex-direction: column;">
                <div class="section-header">
                    <h1>Suporte ao Cliente</h1>
                    <button id="refreshBtn" class="refresh-button">Atualizar</button>
                </div>

                <div class="support-layout">
                    <!-- Threads List -->
                    <div class="threads-panel">
                        <div class="threads-header">
                            <h3>Conversas</h3>
                            <span id="threadsCount" class="badge">0</span>
                        </div>
                        <div id="threadsList" class="threads-list">
                            <div class="loading-state">Carregando conversas...</div>
                        </div>
                    </div>

                    <!-- Chat Panel -->
                    <div class="chat-panel">
                        <div id="chatHeader" class="chat-header" style="display: none;">
                            <div class="chat-user-info">
                                <h3 id="chatUserName">Usuário</h3>
                                <span id="chatUserEmail" class="chat-email"></span>
                            </div>
                            <button id="deleteThreadBtn" class="delete-thread-btn" title="Excluir conversa">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="m19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </button>
                        </div>
                        <div id="chatMessages" class="chat-messages">
                            <div class="empty-state">
                                <p>Selecione uma conversa para visualizar as mensagens</p>
                            </div>
                        </div>
                        <div id="chatInput" class="chat-input-container" style="display: none;">
                            <div class="message-input-wrapper">
                                <div class="message-input-toolbar">
                                    <button id="gifBtn" class="input-toolbar-btn" title="Adicionar GIF">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="9" y1="3" x2="9" y2="21"></line>
                                            <line x1="3" y1="9" x2="21" y2="9"></line>
                                        </svg>
                                        <span>GIF</span>
                                    </button>
                                    <button id="emojiBtn" class="input-toolbar-btn" title="Adicionar emoji">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                                        </svg>
                                    </button>
                                    <button id="attachBtn" class="input-toolbar-btn" title="Anexar arquivo">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                                        </svg>
                                    </button>
                                </div>
                                <textarea id="messageInput" class="message-input" placeholder="Digite sua mensagem..." rows="2"></textarea>
                            </div>
                            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem;">
                                <div id="attachedFiles" class="attached-files-preview"></div>
                                <button id="sendBtn" class="send-button">Enviar</button>
                            </div>
                            <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" multiple>
                            <div id="emojiPicker" class="emoji-picker" style="display: none;"></div>
                            <div id="gifPicker" class="gif-picker" style="display: none;">
                                <div class="gif-picker-header">
                                    <input type="text" id="gifSearch" class="gif-search-input" placeholder="Buscar GIFs...">
                                    <button id="closeGifPicker" class="close-picker-btn">✕</button>
                                </div>
                                <div id="gifResults" class="gif-results"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../script/api-utils.js"></script>
    <script src="../script/admin-role-guard.js"></script>
    <script src="../script/suporte.js"></script>
</body>

</html>
