<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - PromoPing Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/images/PromoPing.png">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-810832454"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-810832454');
  </script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="header-content">
                    <img src="../assets/images/PromoPing.png" alt="PromoPing Logo" class="logo-placeholder">
                        <h4>PromoPing Suporte</h4>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Visão Geral</span>
                </a>
                <a href="utilizadores.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Utilizadores</span>
                </a>
                <a href="produtos.html" class="nav-item active">
                    <span class="nav-icon"></span>
                    <span>Produtos</span>
                </a>
                <a href="avaliacoes.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Avaliações</span>
                </a>
                <a href="suporte.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Suporte</span>
                </a>
                <a href="bugs.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Bugs & Projetos</span>
                </a>
                <a href="sugestoes.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Sugestões</span>
                </a>
                <a href="tabelas.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Incidentes</span>
                </a>
                <a href="calendar.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Calendário</span>
                </a>
                <a href="discord.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Discord</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Perfil</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-button">Sair</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <section class="dashboard-section active" style="display: flex; flex-direction: column;">
                <div class="section-header">
                    <h1>Produtos Monitorados</h1>
                    <button id="refreshProductsBtn" class="refresh-button">Atualizar</button>
                </div>
                <div class="tabs-container filter-tabs" id="productFilterTabs" role="tablist">
                    <button type="button" class="tab-button active" data-filter="todos">Todos</button>
                    <!-- Abas por empresa (Continente, Fnac, Worten, etc.) são inseridas dinamicamente pelo JS -->
                </div>
                <div id="productsList" class="data-table-container">
                    <div class="loading-state">Carregando produtos...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal para editar produto -->
    <div id="editProductModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Editar produto</h2>
                <button class="modal-close" id="closeEditProductModal" type="button">&times;</button>
            </div>
            <form id="editProductForm">
                <input type="hidden" id="editProductId">
                <div class="form-group">
                    <label class="form-label">Produto</label>
                    <input type="text" id="editProductNome" class="form-input" readonly disabled style="background: #1a1a1b; color: #666; cursor: not-allowed; border-color: #333;">
                </div>
                <div class="form-group">
                    <label class="form-label">Utilizador</label>
                    <input type="text" id="editProductUser" class="form-input" readonly disabled style="background: #1a1a1b; color: #666; cursor: not-allowed; border-color: #333;">
                </div>
                <div class="form-group">
                    <label class="form-label">Loja</label>
                    <input type="text" id="editProductLoja" class="form-input" readonly disabled style="background: #1a1a1b; color: #666; cursor: not-allowed; border-color: #333;">
                </div>
                <div class="form-group">
                    <label class="form-label">Link do produto</label>
                    <input type="url" id="editProductLink" class="form-input" required placeholder="https://...">
                </div>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <div>
                        <label class="form-label">Preço atual (EUR)</label>
                        <input type="number" id="editProductPrecoAtual" class="form-input" min="0" step="0.01" required>
                    </div>
                    <div>
                        <label class="form-label">Preço alvo (EUR)</label>
                        <input type="number" id="editProductPrecoAlvo" class="form-input" min="0.01" step="0.01" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="modal-submit-button">Guardar alterações</button>
                    <button type="button" class="modal-cancel-button" id="cancelEditProductBtn">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../script/api-utils.js"></script>
    <script src="../script/alert-modal.js"></script>
    <script src="../script/admin-role-guard.js"></script>
    <script src="../script/produtos.js"></script>
</body>

</html>
