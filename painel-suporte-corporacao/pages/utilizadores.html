<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizadores - PromoPing Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/images/PromoPing.png">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="header-content">
                    <img src="../assets/images/PromoPing.png" alt="PromoPing Logo" class="logo-placeholder">
                        <h4>PromoPing Suporte</h4>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Visão Geral</span>
                </a>
                <a href="utilizadores.html" class="nav-item active">
                    <span class="nav-icon"></span>
                    <span>Utilizadores</span>
                </a>
                <a href="produtos.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Produtos</span>
                </a>
                <a href="avaliacoes.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Avaliações</span>
                </a>
                <a href="suporte.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Suporte</span>
                </a>
                <a href="bugs.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Bugs & Projetos</span>
                </a>
                <a href="sugestoes.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Sugestões</span>
                </a>
                <a href="tabelas.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Incidentes</span>
                </a>
                <a href="calendar.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Calendário</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Perfil</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-button">Sair</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <section class="dashboard-section active" style="display: flex; flex-direction: column;">
                <div class="section-header">
                    <h1>Clientes</h1>
                    <div style="display: flex; gap: 0.5rem;">
                        <button id="exportPDFBtn" class="refresh-button" style="background: #dc2626; color: white;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 0.5rem;">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            Exportar PDF
                        </button>
                        <button id="refreshUsersBtn" class="refresh-button">Atualizar</button>
                    </div>
                </div>
                <div class="tabs-container filter-tabs" role="tablist">
                    <button type="button" class="tab-button active" data-filter="todos">Todos</button>
                    <button type="button" class="tab-button" data-filter="principais">Principais clientes</button>
                    <button type="button" class="tab-button" data-filter="primeira-vez">Clientes pela primeira vez</button>
                    <button type="button" class="tab-button" data-filter="recorrentes">Clientes recorrentes</button>
                    <button type="button" class="tab-button" data-filter="recentes">Clientes recentes</button>
                </div>
                <div id="usersList" class="data-table-container">
                    <div class="loading-state">Carregando utilizadores...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal para Editar Utilizador -->
    <div id="editUserModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Editar Utilizador</h2>
                <button class="modal-close" id="closeEditUserModal">&times;</button>
            </div>
            <form id="editUserForm">
                <div class="form-group">
                    <label class="form-label">Referência</label>
                    <input type="text" id="editReferenciaID" class="form-input" readonly disabled style="background: #1a1a1b; color: #666; cursor: not-allowed; border-color: #333;">
                    <small style="color: #666; font-size: 0.75rem; margin-top: 0.25rem; display: block;">A referência não pode ser alterada</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Nome</label>
                    <input type="text" id="editNome" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="editEmail" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select id="editAtivo" class="form-input" required>
                        <option value="1">Ativo</option>
                        <option value="0">Inativo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Verificado</label>
                    <select id="editEmailVerificado" class="form-input" required>
                        <option value="1">Sim</option>
                        <option value="0">Não</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="modal-submit-button">Salvar Alterações</button>
                    <button type="button" class="modal-cancel-button" id="cancelEditUserBtn">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../script/api-utils.js"></script>
    <script src="../script/alert-modal.js"></script>
    <script src="../script/admin-role-guard.js"></script>
    <script src="../script/utilizadores.js"></script>
</body>

</html>
