<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - PromoPing Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/images/PromoPing.png">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="header-content">
                    <img src="../assets/images/PromoPing.png" alt="PromoPing Logo" class="logo-placeholder">
                    <h2>PromoPing Admin</h2>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Visão Geral</span>
                </a>
                <a href="utilizadores.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Utilizadores</span>
                </a>
                <a href="produtos.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Produtos</span>
                </a>
                <a href="avaliacoes.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Avaliações</span>
                </a>
                <a href="suporte.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Suporte</span>
                </a>
                <a href="bugs.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Bugs & Projetos</span>
                </a>
                <a href="tabelas.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Incidentes</span>
                </a>
                <a href="calendar.html" class="nav-item">
                    <span class="nav-icon"></span>
                    <span>Calendário</span>
                </a>
                <a href="perfil.html" class="nav-item active">
                    <span class="nav-icon"></span>
                    <span>Perfil</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-button">Sair</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <section class="dashboard-section active" style="display: flex; flex-direction: column;">
                <div class="section-header">
                    <h1>Perfil do Suporte</h1>
                </div>

                <div class="profile-container">
                    <!-- Foto de Perfil -->
                    <div class="profile-photo-section">
                        <div class="profile-photo-wrapper">
                            <div id="profilePhoto" class="profile-photo" style="display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 700; color: #ff9800; background: #232326; border: 3px solid #ff9800;">PP</div>
                            <div class="photo-buttons">
                                <button id="changePhotoBtn" class="change-photo-btn">Alterar Foto</button>
                                <button id="removePhotoBtn" class="remove-photo-btn" style="display: none;">Remover Foto</button>
                            </div>
                            <input type="file" id="photoInput" accept="image/*" style="display: none;">
                        </div>
                    </div>

                    <!-- Formulário de Perfil -->
                    <form id="profileForm" class="profile-form">
                        <div class="form-group">
                            <label class="form-label">Nome</label>
                            <input type="text" id="profileName" class="form-input" required placeholder="Seu nome completo">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="profileEmail" class="form-input" required placeholder="seu@email.com">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Descrição</label>
                            <textarea id="profileDescription" class="form-input" rows="5" placeholder="Descreva-se brevemente..."></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Especialidade</label>
                            <input type="text" id="profileSpecialty" class="form-input" placeholder="Ex: Suporte Técnico, Atendimento ao Cliente">
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="modal-submit-button">Salvar Perfil</button>
                            <button type="button" class="modal-cancel-button" id="cancelBtn">Cancelar</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="../script/perfil.js"></script>
</body>

</html>
