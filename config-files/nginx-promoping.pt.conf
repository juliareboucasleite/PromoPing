# Configuração NGINX para PromoPing - Produção
# Domínio: promoping.pt
# Backend: porta 3000
# Frontend: arquivos estáticos em /var/www/promoping/frontend

server {
    listen 80;
    listen [::]:80;
    server_name promoping.pt www.promoping.pt;

    # Redirecionar HTTP para HTTPS (descomente após configurar SSL)
    # return 301 https://$server_name$request_uri;

    # Logs
    access_log /var/log/nginx/promoping-access.log;
    error_log /var/log/nginx/promoping-error.log;

    # Tamanho máximo de upload
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # ==================== API BACKEND ====================
    # Proxy reverso para o backend Node.js na porta 3000
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Headers importantes para o proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # WebSocket support (se necessário)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Rate limiting específico para autenticação
    location ~ ^/api/auth/(login|register|verify) {
        limit_req zone=auth burst=5 nodelay;
        
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== FRONTEND ESTÁTICO ====================
    # Raiz do frontend
    root /var/www/promoping/frontend;
    index pages/index.html;

    # Servir arquivos estáticos do frontend
    location / {
        limit_req zone=general burst=50 nodelay;
        
        # Tentar servir o arquivo solicitado, se não existir, tentar como diretório,
        # se ainda não existir, servir a página inicial
        try_files $uri $uri/ /pages/index.html;
    }

    # Cache para HTML (curto)
    location ~ \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Assets estáticos com cache longo
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Páginas específicas
    location ~ ^/(dashboard|login|register|docs|about) {
        try_files $uri $uri/ /pages/index.html;
    }

    # Arquivos de includes
    location /inc/ {
        try_files $uri =404;
    }

    # Arquivos de assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Páginas
    location /pages/ {
        try_files $uri =404;
    }

    # ==================== OUTRAS ROTAS ====================
    # Health check
    location /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # OpenAPI spec
    location /openapi.yaml {
        proxy_pass http://127.0.0.1:3000;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|sql|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

