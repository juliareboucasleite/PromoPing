version: '3.8'

services:
  # Aplicação principal
  app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "8080:80"
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_USER=promoping
      - DB_PASS=promoping123
      - DB_NAME=promoping
      - JWT_SECRET=dev-secret-key
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - promoping-network

  # Base de dados MySQL
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=promoping
      - MYSQL_USER=promoping
      - MYSQL_PASSWORD=promoping123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/PAPv5.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - promoping-network

  # phpMyAdmin para gestão da BD
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_HOST=mysql
      - PMA_USER=promoping
      - PMA_PASSWORD=promoping123
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - promoping-network

volumes:
  mysql_data:

networks:
  promoping-network:
    driver: bridge
