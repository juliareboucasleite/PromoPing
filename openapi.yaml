openapi: 3.0.3
info:
  title: PromoPing API
  description: |
    API RESTful do PromoPing - Sistema de monitorização de preços de produtos.
    
    A API permite aos utilizadores:
    - Monitorizar preços de produtos em múltiplas lojas online
    - Receber notificações quando os preços atingem valores alvo
    - Gerir produtos, preferências e assinaturas
    - Exportar dados em diferentes formatos
    
    **Autenticação**: A maioria dos endpoints requer autenticação via JWT Bearer Token.
    **Planos**: Algumas funcionalidades estão limitadas por plano (Free, Basic, Standard, Premium).
  version: 2.3.3
  contact:
    name: PromoPing Support
    email: support@promoping.com
  license:
    name: ISC
    url: https://opensource.org/licenses/ISC

servers:
  - url: http://127.0.0.1:3000
    description: Servidor de desenvolvimento local
  - url: https://api.promoping.com
    description: Servidor de produção

tags:
  - name: Autenticação
    description: Endpoints para registo, login e autenticação OAuth
  - name: Utilizadores
    description: Gestão de perfis e dados de utilizadores
  - name: Produtos
    description: CRUD de produtos monitorizados
  - name: Notificações
    description: Gestão de notificações e preferências
  - name: Pagamentos
    description: Gestão de planos e assinaturas Stripe
  - name: Suporte
    description: Sistema de suporte ao cliente com threads
  - name: Exportação
    description: Exportação de dados em Excel, PDF e relatórios
  - name: Status
    description: Status do sistema e métricas
  - name: Charts
    description: Dados para gráficos e estatísticas

security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags:
        - Status
      summary: Health Check
      description: Verifica o status da API
      security: []
      responses:
        '200':
          description: API está operacional
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: number
                    example: 12345.67
                  environment:
                    type: string
                    example: development
                  version:
                    type: string
                    example: 2.3.3

  /api/:
    get:
      tags:
        - Status
      summary: Informações da API
      description: Retorna informações básicas sobre a API
      security: []
      responses:
        '200':
          description: Informações da API
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  version:
                    type: string
                  endpoints:
                    type: object

  # ================== AUTENTICAÇÃO ==================
  /api/auth/register:
    post:
      tags:
        - Autenticação
      summary: Registar novo utilizador
      description: Cria uma nova conta de utilizador com email e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - password
              properties:
                nome:
                  type: string
                  example: João Silva
                email:
                  type: string
                  format: email
                  example: joao@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: senha123
                telefone:
                  type: string
                  example: +351912345678
      responses:
        '200':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                  codigo:
                    type: string
                    description: Código de verificação (apenas em desenvolvimento)
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags:
        - Autenticação
      summary: Login com email e senha
      description: Autentica um utilizador e retorna um token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: joao@example.com
                password:
                  type: string
                  format: password
                  example: senha123
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  token:
                    type: string
                    description: JWT token para autenticação
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Credenciais inválidas
        '403':
          description: Email não verificado

  /api/auth/google:
    get:
      tags:
        - Autenticação
      summary: Iniciar autenticação Google OAuth
      description: Redireciona para o Google OAuth
      security: []
      responses:
        '302':
          description: Redirecionamento para Google OAuth

  /api/auth/google/callback:
    get:
      tags:
        - Autenticação
      summary: Callback Google OAuth
      description: Processa o retorno do Google OAuth
      security: []
      responses:
        '302':
          description: Redirecionamento com token

  /api/auth/github:
    get:
      tags:
        - Autenticação
      summary: Iniciar autenticação GitHub OAuth
      description: Redireciona para o GitHub OAuth
      security: []
      responses:
        '302':
          description: Redirecionamento para GitHub OAuth

  /api/auth/github/callback:
    get:
      tags:
        - Autenticação
      summary: Callback GitHub OAuth
      description: Processa o retorno do GitHub OAuth
      security: []
      responses:
        '302':
          description: Redirecionamento com token

  /api/auth/discord:
    get:
      tags:
        - Autenticação
      summary: Iniciar autenticação Discord OAuth
      description: Redireciona para o Discord OAuth
      security: []
      responses:
        '302':
          description: Redirecionamento para Discord OAuth

  /api/auth/discord/callback:
    get:
      tags:
        - Autenticação
      summary: Callback Discord OAuth
      description: Processa o retorno do Discord OAuth
      security: []
      responses:
        '302':
          description: Redirecionamento com token

  /api/auth/esqueci-senha:
    post:
      tags:
        - Autenticação
      summary: Recuperar senha
      description: Envia código de recuperação por email ou WhatsApp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emailOuTelefone
              properties:
                emailOuTelefone:
                  type: string
                  example: joao@example.com
      responses:
        '200':
          description: Código enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  canal:
                    type: string
                    enum: [email, whatsapp]

  /api/auth/resetar-senha:
    post:
      tags:
        - Autenticação
      summary: Redefinir senha
      description: Redefine a senha usando código de verificação
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emailOuTelefone
                - codigo
                - novaSenha
              properties:
                emailOuTelefone:
                  type: string
                codigo:
                  type: string
                novaSenha:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Senha redefinida com sucesso

  # ================== UTILIZADORES ==================
  /api/user/me:
    get:
      tags:
        - Utilizadores
      summary: Obter dados do utilizador autenticado
      description: Retorna informações do utilizador atual
      responses:
        '200':
          description: Dados do utilizador
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /api/user/profile:
    get:
      tags:
        - Utilizadores
      summary: Obter perfil completo
      description: Retorna perfil com contas conectadas e preferências
      responses:
        '200':
          description: Perfil do utilizador
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  profile:
                    $ref: '#/components/schemas/Profile'
    put:
      tags:
        - Utilizadores
      summary: Atualizar perfil
      description: Atualiza nome, email e telefone do utilizador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                email:
                  type: string
                  format: email
                telefone:
                  type: string
      responses:
        '200':
          description: Perfil atualizado

  /api/user/stats:
    get:
      tags:
        - Utilizadores
      summary: Estatísticas do utilizador
      description: Retorna estatísticas de produtos, notificações e dinheiro poupado
      responses:
        '200':
          description: Estatísticas
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  stats:
                    type: object
                    properties:
                      produtos_total:
                        type: integer
                      notificacoes_total:
                        type: integer
                      dinheiro_poupado:
                        type: number
                      membro_desde:
                        type: string

  /api/user/plano:
    get:
      tags:
        - Utilizadores
      summary: Obter plano atual
      description: Retorna informações do plano do utilizador
      responses:
        '200':
          description: Informações do plano
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  plano:
                    $ref: '#/components/schemas/Plano'
                  is_in_grace_period:
                    type: boolean
                  grace_period_end:
                    type: string
                    format: date-time
                    nullable: true

  /api/user/planos:
    get:
      tags:
        - Utilizadores
      summary: Listar todos os planos
      description: Retorna todos os planos disponíveis
      responses:
        '200':
          description: Lista de planos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  planos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plano'
                  userPlanId:
                    type: integer

  /api/user/change-password:
    post:
      tags:
        - Utilizadores
      summary: Alterar senha
      description: Altera a senha do utilizador (requer senha atual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Senha alterada com sucesso

  /api/user/set-password:
    post:
      tags:
        - Utilizadores
      summary: Configurar senha
      description: Configura senha para utilizadores sem senha (OAuth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Senha configurada

  # ================== PRODUTOS ==================
  /api/produtos:
    get:
      tags:
        - Produtos
      summary: Listar produtos
      description: Retorna todos os produtos do utilizador
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  produtos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Produto'
    post:
      tags:
        - Produtos
      summary: Adicionar produto
      description: Adiciona um novo produto para monitorização (respeitando limite do plano)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - link
                - precoAlvo
              properties:
                nome:
                  type: string
                  example: iPhone 15 Pro
                link:
                  type: string
                  format: uri
                  example: https://www.pcdiga.com/iphone-15-pro
                precoAlvo:
                  type: number
                  minimum: 0
                  example: 999.99
                data:
                  type: string
                  format: date
                  description: Data limite para monitorização
      responses:
        '200':
          description: Produto adicionado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  produto:
                    $ref: '#/components/schemas/Produto'
                  storeInfo:
                    type: object
        '403':
          description: Limite de produtos atingido

  /api/produtos/{id}:
    put:
      tags:
        - Produtos
      summary: Editar produto
      description: Atualiza informações de um produto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                link:
                  type: string
                  format: uri
                data:
                  type: string
                  format: date
      responses:
        '200':
          description: Produto atualizado
        '404':
          description: Produto não encontrado
    delete:
      tags:
        - Produtos
      summary: Remover produto
      description: Remove um produto da monitorização
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Produto removido
        '404':
          description: Produto não encontrado

  /api/produtos/{id}/historico:
    get:
      tags:
        - Produtos
      summary: Histórico de preços
      description: Retorna histórico de preços de um produto
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Histórico de preços
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  historico:
                    type: array
                    items:
                      type: object
                      properties:
                        preco:
                          type: number
                        data:
                          type: string

  /api/produtos/sync:
    get:
      tags:
        - Produtos
      summary: Sincronização de produtos
      description: Retorna produtos atualizados desde um timestamp
      parameters:
        - name: lastSync
          in: query
          schema:
            type: integer
            description: Timestamp Unix em milissegundos
      responses:
        '200':
          description: Produtos atualizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  produtos:
                    type: array
                  timestamp:
                    type: integer

  # ================== NOTIFICAÇÕES ==================
  /api/notificacoes:
    get:
      tags:
        - Notificações
      summary: Listar notificações
      description: Retorna notificações do utilizador
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de notificações
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  notificacoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notificacao'

  /api/notificacoes/{id}/lida:
    put:
      tags:
        - Notificações
      summary: Marcar notificação como lida
      description: Marca uma notificação como lida
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notificação marcada como lida

  # ================== PAGAMENTOS ==================
  /api/payment/create-checkout-session:
    post:
      tags:
        - Pagamentos
      summary: Criar sessão de checkout
      description: Cria uma sessão de checkout Stripe para assinatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planoId
              properties:
                planoId:
                  type: integer
                  description: ID do plano
      responses:
        '200':
          description: Sessão criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  session_id:
                    type: string
                  checkout_url:
                    type: string
                  plano:
                    $ref: '#/components/schemas/Plano'

  /api/payment/verify-session:
    post:
      tags:
        - Pagamentos
      summary: Verificar sessão de checkout
      description: Verifica o status de uma sessão de checkout e salva assinatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
              properties:
                session_id:
                  type: string
      responses:
        '200':
          description: Sessão verificada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  session:
                    type: object

  /api/payment/cancel-subscription:
    post:
      tags:
        - Pagamentos
      summary: Cancelar assinatura
      description: Cancela assinatura com período de graça de 30 dias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subscription_id
              properties:
                subscription_id:
                  type: string
                cancel_type:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Assinatura cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  grace_period_end:
                    type: string
                    format: date-time

  /api/payment/create-portal-session:
    post:
      tags:
        - Pagamentos
      summary: Criar sessão do portal do cliente
      description: Cria uma sessão do portal Stripe para gestão de assinatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
              properties:
                customer_id:
                  type: string
      responses:
        '200':
          description: URL do portal criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  portal_url:
                    type: string

  # ================== SUPORTE ==================
  /api/support/messages:
    get:
      tags:
        - Suporte
      summary: Listar threads de suporte
      description: Retorna threads de suporte do utilizador autenticado
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: threadId
          in: query
          schema:
            type: integer
            description: Filtrar por thread específica
      responses:
        '200':
          description: Lista de threads
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportThread'
                  pagination:
                    type: object
    post:
      tags:
        - Suporte
      summary: Criar nova thread
      description: Cria uma nova thread de suporte (nova conversa)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Thread criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportThread'

  /api/support/messages/{id}:
    get:
      tags:
        - Suporte
      summary: Obter thread específica
      description: Retorna uma thread com todas as respostas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thread com respostas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/SupportMessage'
                  replies:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportMessage'

  /api/support/messages/{id}/reply:
    post:
      tags:
        - Suporte
      summary: Responder thread
      description: Adiciona uma resposta a uma thread existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                senderType:
                  type: string
                  enum: [user, support]
                  default: user
      responses:
        '201':
          description: Resposta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportMessage'

  # ================== EXPORTAÇÃO ==================
  /api/exportar/produtos/excel:
    get:
      tags:
        - Exportação
      summary: Exportar produtos para Excel
      description: Exporta produtos do utilizador para Excel (requer plano pago)
      responses:
        '200':
          description: Arquivo Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '403':
          description: Plano insuficiente

  /api/exportar/produtos/pdf:
    get:
      tags:
        - Exportação
      summary: Exportar produtos para PDF
      description: Exporta produtos do utilizador para PDF (requer plano Standard ou Premium)
      responses:
        '200':
          description: Arquivo PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: Plano insuficiente

  /api/exportar/incidentes/excel:
    get:
      tags:
        - Exportação
      summary: Exportar incidentes para Excel
      description: Exporta incidentes do sistema para Excel (requer plano pago)
      responses:
        '200':
          description: Arquivo Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /api/exportar/relatorio/completo:
    get:
      tags:
        - Exportação
      summary: Exportar relatório completo
      description: Exporta relatório completo do sistema (requer plano Premium)
      responses:
        '200':
          description: Arquivo do relatório
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '403':
          description: Plano insuficiente

  # ================== STATUS ==================
  /api/status:
    get:
      tags:
        - Status
      summary: Status do sistema
      description: Retorna status geral do sistema, componentes e incidentes
      security: []
      responses:
        '200':
          description: Status do sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  metricas:
                    type: object
                  componentes:
                    type: array
                  incidentes:
                    type: array

  # ================== CHARTS ==================
  /api/charts/overview:
    get:
      tags:
        - Charts
      summary: Dados de overview
      description: Retorna dados mensais para gráficos de overview
      security: []
      parameters:
        - name: months
          in: query
          schema:
            type: integer
            default: 9
      responses:
        '200':
          description: Dados para gráficos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  labels:
                    type: array
                    items:
                      type: string
                  series:
                    type: object
                    properties:
                      produtosCriados:
                        type: array
                        items:
                          type: integer
                      notificacoes:
                        type: array
                        items:
                          type: integer
                      utilizadoresNovos:
                        type: array
                        items:
                          type: integer

  /api/charts/daily:
    get:
      tags:
        - Charts
      summary: Dados diários
      description: Retorna dados diários para gráficos
      security: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: Dados diários
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  labels:
                    type: array
                    items:
                      type: string
                  series:
                    type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido via /api/auth/login

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
        fotoPerfil:
          type: string
          nullable: true
        perfilId:
          type: integer
          nullable: true
        DataCriacao:
          type: string
          format: date

    Profile:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
        contas_conectadas:
          type: array
          items:
            type: object
            properties:
              Tipo:
                type: string
              Conectado:
                type: boolean
        preferencias:
          type: array
          items:
            type: object

    Produto:
      type: object
      properties:
        Id:
          type: integer
        Nome:
          type: string
        Link:
          type: string
          format: uri
        PrecoAtual:
          type: number
          nullable: true
        PrecoAlvo:
          type: number
        DataCriacao:
          type: string
          format: date-time
        DataLimite:
          type: string
          format: date
          nullable: true
        Loja:
          type: string
        storeInfo:
          type: object
        Historico:
          type: array
          items:
            type: object
            properties:
              Preco:
                type: number
              Data:
                type: string

    Notificacao:
      type: object
      properties:
        Id:
          type: integer
        Tipo:
          type: string
        Mensagem:
          type: string
        DataEnvio:
          type: string
          format: date-time
        ValorPoupado:
          type: number
          nullable: true

    Plano:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          enum: [Free, Basic, Standard, Premium]
        preco:
          type: number
        verificacao_intervalo:
          type: integer
          description: Intervalo de verificação em minutos
        limite_produtos:
          type: integer
        status:
          type: string
        expiracao:
          type: string
          format: date-time
          nullable: true

    SupportThread:
      type: object
      properties:
        id:
          type: integer
        threadId:
          type: integer
        message:
          type: string
        senderType:
          type: string
          enum: [user, support]
        userId:
          type: integer
        createdAt:
          type: string
          format: date-time
        replyCount:
          type: integer

    SupportMessage:
      type: object
      properties:
        id:
          type: integer
        message:
          type: string
        senderType:
          type: string
          enum: [user, support]
        replyTo:
          type: integer
          nullable: true
        threadId:
          type: integer
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          description: Mensagem de erro
        message:
          type: string
          description: Mensagem adicional (opcional)

