<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registar — PromoPing</title>
  <base href="/PromoPing/frontend/">
  <link rel="stylesheet" href="assets/styles/header.css">
  <link rel="stylesheet" href="assets/styles/register.css">
  <link rel="icon" type="image/png" href="assets/images/PromoPing.png">
</head>
<body class="login-page">

  <!-- ===== HEADER ===== -->
  <div id="header-register-include"></div>

  <!-- Scripts -->
  <script src="assets/scripts/request-manager.js"></script>
  <script src="assets/scripts/notification-system.js"></script>
  <script src="pages/inc/load-includes-register.js"></script>

  <!-- ===== MAIN ===== -->
  <main class="login-main">
    <div class="register-container">
      
      <!-- Título -->
      <h1 class="register-title">Criar Conta</h1>
      <p class="register-subtitle">Junte-se ao PromoPing e comece a poupar dinheiro</p>

      <!-- Mensagens de erro/sucesso -->
      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <!-- Social login -->
      <div class="social-login-group">
        <button class="social-btn social-btn-google" id="btnGoogle">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
        <button class="social-btn social-btn-discord" id="btnDiscord">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          Discord
        </button>
      </div>


      <div class="divider" id="emailDivider"><span>ou registe-se com email</span></div>

      <!-- ===== FORM EMAIL ===== -->
      <form class="login-form" id="regForm">
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input type="text" class="form-input" id="nome" placeholder="O seu nome completo" required>
        </div>

        <div class="form-group">
          <label class="form-label">Endereço de email</label>
          <input type="email" class="form-input" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Palavra-passe</label>
            <div class="password-input">
              <input type="password" class="form-input" id="senha" placeholder="Mínimo 6 caracteres" required>
              <button type="button" class="password-toggle" onclick="togglePassword('senha')" id="toggle-senha">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Confirmar palavra-passe</label>
            <div class="password-input">
              <input type="password" class="form-input" id="confirmar" placeholder="Repita a palavra-passe" required>
              <button type="button" class="password-toggle" onclick="togglePassword('confirmar')" id="toggle-confirmar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Telefone opcional -->
        <div class="phone-optional">
          <label class="form-label">Número de telemóvel</label>
          <input type="tel" class="form-input" id="telefoneOpcional" placeholder="+351 912 345 678">
          <small style="color: #6c757d; font-size: 0.85rem; margin-top: 5px; display: block;">
            Adicione o seu número para receber notificações por SMS
          </small>
        </div>

        <div class="register-actions">
          <a href="../../pages/index.html" class="btn-register btn-cancel">Cancelar</a>
          <button type="submit" class="btn-register btn-create" id="btnCriar">Criar Conta</button>
        </div>
      </form>

      <!-- Caixa de verificação de email -->
      <div class="verify-box" id="verifyBox">
        <h3>Verifique o seu email</h3>
        <p>Enviamos um código de 6 dígitos para <strong id="verifyEmail"></strong></p>
        <div class="code-inputs">
          <input maxlength="1" class="code-digit" type="text" inputmode="numeric">
          <input maxlength="1" class="code-digit" type="text" inputmode="numeric">
          <input maxlength="1" class="code-digit" type="text" inputmode="numeric">
          <input maxlength="1" class="code-digit" type="text" inputmode="numeric">
          <input maxlength="1" class="code-digit" type="text" inputmode="numeric">
          <input maxlength="1" class="code-digit" type="text" inputmode="numeric">
        </div>
        <div class="verify-actions">
          <button id="btnConfirmar" class="btn-register btn-create">Confirmar</button>
          <button id="btnReenviar" class="btn-register btn-cancel" disabled>Reenviar código</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <div id="footer-placeholder"></div>
  <script>
    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      if (!field) {
        console.error('Campo não encontrado: ' + fieldId);
        return;
      }
      
      if (field.type === "password") {
        field.type = "text";
        // Atualizar ícone para mostrar que está visível
        const toggle = document.getElementById(`toggle-${fieldId}`);
        if (toggle) {
          toggle.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
              <path d="M2 2l20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          `;
        }
      } else {
        field.type = "password";
        // Atualizar ícone para mostrar que está escondido
        const toggle = document.getElementById(`toggle-${fieldId}`);
        if (toggle) {
          toggle.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/>
            </svg>
          `;
        }
      }
    }
  </script>

  <script type="module">
    // ===== NAVIGATION FUNCTIONS =====
    function toggleNavigation() {
      const html = document.documentElement;
      html.classList.toggle('opened-nav');
    }

    // ===== FUNÇÕES AUXILIARES =====
    function showError(message) {
      const errorDiv = document.getElementById("errorMessage");
      errorDiv.textContent = message;
      errorDiv.style.display = "block";
      setTimeout(() => errorDiv.style.display = "none", 5000);
    }

    function showSuccess(message) {
      const successDiv = document.getElementById("successMessage");
      successDiv.textContent = message;
      successDiv.style.display = "block";
      setTimeout(() => successDiv.style.display = "none", 5000);
    }

    // ===== REGISTO NORMAL =====
    async function registarUtilizador(nome, email, password, telefone = null) {
      console.log("📤 Enviando requisição de registro...");
      try {
        const res = await makeRequest("http://127.0.0.1:3000/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome, email, password, telefone }),
        });
        
        console.log("📥 Status HTTP:", res.status);
        console.log("📥 Status OK:", res.ok);
        
        const data = await res.json();
        console.log("📥 Dados parseados:", data);
        
        // Se o status HTTP não for OK, adicionar status de erro
        if (!res.ok) {
          return {
            status: "error",
            error: data.error || data.message || `Erro HTTP ${res.status}`,
            details: data.details || data
          };
        }
        
        return data;
      } catch (error) {
        console.error("❌ Erro na requisição:", error);
        throw error;
      }
    }

    function guardarToken(token) {
      localStorage.setItem("token", token);
    }

    // Validação de formulário
    function validarFormulario() {
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar").value;

      if (!nome) {
        showError("Por favor, insira o seu nome completo");
        return false;
      }

      if (!email || !email.includes("@")) {
        showError("Por favor, insira um email válido");
        return false;
      }

      if (senha.length < 6) {
        showError("A palavra-passe deve ter pelo menos 6 caracteres");
        return false;
      }

      if (senha !== confirmar) {
        showError("As palavras-passe não coincidem");
        return false;
      }

      return true;
    }

    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!validarFormulario()) {
        return;
      }

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const telefone = document.getElementById("telefoneOpcional").value.trim();

      // Desabilitar botão durante o processo
      const btnCriar = document.getElementById("btnCriar");
      btnCriar.disabled = true;
      btnCriar.textContent = "A criar conta...";

      try {
        const data = await registarUtilizador(nome, email, senha, telefone || null);
        
        console.log("📥 Resposta completa do servidor:", data);
        console.log("📥 Status da resposta:", data.status);
        console.log("📥 Mensagem:", data.message);
        console.log("📥 Erro:", data.error);
        
        if (data.status === "ok") {
          console.log("✅ Registro bem-sucedido!");
          showSuccess("Conta criada com sucesso! Verifique o seu email.");
          document.getElementById("verifyBox").style.display = "block";
          document.getElementById("regForm").style.display = "none";
          document.getElementById("verifyEmail").textContent = email;
          iniciarReenvio(email);
        } else {
          console.error("❌ Erro no registro:", data);
          const errorMessage = data.error || data.message || "Erro ao criar conta";
          console.error("❌ Mensagem de erro:", errorMessage);
          if (data.details) {
            console.error("❌ Detalhes do erro:", data.details);
          }
          showError(errorMessage);
        }
      } catch (error) {
        console.error("❌ Exceção ao registrar:", error);
        console.error("❌ Tipo do erro:", typeof error);
        console.error("❌ Mensagem:", error.message);
        console.error("❌ Stack:", error.stack);
        showError(error.message || "Erro de ligação ao servidor");
      } finally {
        btnCriar.disabled = false;
        btnCriar.textContent = "Criar Conta";
      }
    });

    // ===== VERIFICAÇÃO DE EMAIL =====
    function getCodigoDigitado() {
      return Array.from(document.querySelectorAll(".code-digit"))
        .map(i => i.value)
        .join("");
    }

    document.getElementById("btnConfirmar").addEventListener("click", async () => {
      const email = document.getElementById("verifyEmail").textContent;
      const codigo = getCodigoDigitado();

        const res = await makeRequest("http://127.0.0.1:3000/api/auth/email/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, codigo })
      });
      const data = await res.json();

      if (data.status === "ok" && data.token) {
        guardarToken(data.token);
        location.href = "/PromoPing/frontend/pages/dashboard/Painel.html";
      } else {
        showError("Erro", data.error || "Código inválido");
      }
    });

    // ===== REENVIAR CÓDIGO =====
    function iniciarReenvio(email) {
      const btn = document.getElementById("btnReenviar");
      btn.disabled = true;

      let tempo = 30;
      btn.textContent = `Reenviar (${tempo}s)`;

      const interval = setInterval(() => {
        tempo--;
        btn.textContent = `Reenviar (${tempo}s)`;
        if (tempo <= 0) {
          clearInterval(interval);
          btn.disabled = false;
          btn.textContent = "Reenviar código";
          btn.onclick = async () => {
            await makeRequest("http://127.0.0.1:3000/api/auth/email/send", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email })
            });
            iniciarReenvio(email);
          };
        }
      }, 1000);
    }

    // ===== REGISTO GOOGLE =====
    document.getElementById("btnGoogle").addEventListener("click", () => {
      window.location.href = "http://127.0.0.1:3000/auth/google";
    });

    // ===== REGISTO DISCORD =====
    document.getElementById("btnDiscord").addEventListener("click", async () => {
      try {
        // Verificar se usuário Discord já existe
        const response = await makeRequest(`http://127.0.0.1:3000/api/auth/discord/check/916737425978589235`);
        const data = await response.json();
        
        if (data.exists) {
          // Usuário já existe - avisar para fazer login
          showInfo("Usuário já registrado", "Usuário Discord já registrado! Por favor, faça login usando o botão Discord na página de login.");
          window.location.href = "/PromoPing/frontend/pages/inc/Login.html";
          return;
        } else {
          // Usuário não existe - redirecionar para Discord OAuth
          console.log("🆕 Usuário Discord não encontrado - redirecionando para OAuth");
          window.location.href = "http://127.0.0.1:3000/auth/discord";
        }
      } catch (error) {
        console.error(" Erro ao verificar usuário Discord:", error);
        // Em caso de erro, tentar OAuth normal
        window.location.href = "http://127.0.0.1:3000/auth/discord";
      }
    });


    // ===== MELHORAR UX DOS CÓDIGOS =====
    document.querySelectorAll('.code-digit').forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < 5) {
          document.querySelectorAll('.code-digit')[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
          document.querySelectorAll('.code-digit')[index - 1].focus();
        }
      });
    });
  </script>

  <script>
    // Navigation functions
    function openNavigation(button) {
      const navLinks = button.nextElementSibling;
      const isOpen = navLinks.style.display === 'block';
      
      // Close all other dropdowns
      document.querySelectorAll('.pp-header-nav-links').forEach(link => {
        link.style.display = 'none';
      });
      
      // Toggle current dropdown
      navLinks.style.display = isOpen ? 'none' : 'block';
    }

    function toggleNavigation() {
      const html = document.documentElement;
      html.classList.toggle('opened-nav');
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', function(event) {
      if (!event.target.closest('.pp-header-nav-wrapper')) {
        document.querySelectorAll('.pp-header-nav-links').forEach(link => {
          link.style.display = 'none';
        });
      }
    });

    // Language toggle function
    function toggleLanguage() {
      const langText = document.getElementById('lang-text');
      const currentLang = langText.textContent;
      
      if (currentLang === 'PT') {
        langText.textContent = 'EN';
        translateToEnglish();
      } else {
        langText.textContent = 'PT';
        translateToPortuguese();
      }
    }

    function translateToEnglish() {
      // Traduzir elementos específicos do register
      const title = document.querySelector('.register-title');
      if (title) title.textContent = 'Create Account';
      
      const subtitle = document.querySelector('.register-subtitle');
      if (subtitle) subtitle.textContent = 'Join PromoPing and start saving money';
      
      const nameLabel = document.querySelector('label[for="name"]');
      if (nameLabel) nameLabel.textContent = 'Full name';
      
      const emailLabel = document.querySelector('label[for="email"]');
      if (emailLabel) emailLabel.textContent = 'Email address';
      
      const passwordLabel = document.querySelector('label[for="password"]');
      if (passwordLabel) passwordLabel.textContent = 'Password';
      
      const confirmLabel = document.querySelector('label[for="confirm-password"]');
      if (confirmLabel) confirmLabel.textContent = 'Confirm password';
      
      const phoneLabel = document.querySelector('label[for="phone"]');
      if (phoneLabel) phoneLabel.textContent = 'Mobile number (optional)';
      
      const registerBtn = document.querySelector('.register-btn');
      if (registerBtn) registerBtn.textContent = 'Create Account';
      
      const cancelBtn = document.querySelector('.cancel-btn');
      if (cancelBtn) cancelBtn.textContent = 'Cancel';

      // Traduzir elementos adicionais
      const googleBtn = document.querySelector('.google-btn');
      if (googleBtn) googleBtn.textContent = 'Continue with Google';
      
      const smsBtn = document.querySelector('.social-btn-phone');
      if (smsBtn) smsBtn.textContent = 'Continue with SMS';
      
      const orText = document.querySelector('.or-text');
      if (orText) orText.textContent = 'or register with email';
      
      const phoneHint = document.querySelector('.phone-hint');
      if (phoneHint) phoneHint.textContent = 'Add your number to receive SMS notifications';
      
      const termsText = document.querySelector('.terms-text');
      if (termsText) termsText.textContent = 'By creating an account, you agree to our Terms of Service and Privacy Policy';
    }

    function translateToPortuguese() {
      // Traduzir de volta para português
      const title = document.querySelector('.register-title');
      if (title) title.textContent = 'Criar Conta';
      
      const subtitle = document.querySelector('.register-subtitle');
      if (subtitle) subtitle.textContent = 'Junte-se ao PromoPing e comece a poupar dinheiro';
      
      const nameLabel = document.querySelector('label[for="name"]');
      if (nameLabel) nameLabel.textContent = 'Nome completo';
      
      const emailLabel = document.querySelector('label[for="email"]');
      if (emailLabel) emailLabel.textContent = 'Endereço de email';
      
      const passwordLabel = document.querySelector('label[for="password"]');
      if (passwordLabel) passwordLabel.textContent = 'Palavra-passe';
      
      const confirmLabel = document.querySelector('label[for="confirm-password"]');
      if (confirmLabel) confirmLabel.textContent = 'Confirmar palavra-passe';
      
      const phoneLabel = document.querySelector('label[for="phone"]');
      if (phoneLabel) phoneLabel.textContent = 'Número de telemóvel (opcional)';
      
      const registerBtn = document.querySelector('.register-btn');
      if (registerBtn) registerBtn.textContent = 'Criar Conta';
      
      const cancelBtn = document.querySelector('.cancel-btn');
      if (cancelBtn) cancelBtn.textContent = 'Cancelar';

      // Traduzir elementos adicionais de volta para português
      const googleBtn = document.querySelector('.google-btn');
      if (googleBtn) googleBtn.textContent = 'Continuar com Google';
      
      const smsBtn = document.querySelector('.social-btn-phone');
      if (smsBtn) smsBtn.textContent = 'Continuar com SMS';
      
      const orText = document.querySelector('.or-text');
      if (orText) orText.textContent = 'ou registe-se com email';
      
      const phoneHint = document.querySelector('.phone-hint');
      if (phoneHint) phoneHint.textContent = 'Adicione o seu número para receber notificações por SMS';
      
      const termsText = document.querySelector('.terms-text');
      if (termsText) termsText.textContent = 'Ao criar uma conta, concorda com os nossos Termos de Serviço e Política de Privacidade';
    }
  </script>
</body>
</html>
