<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoPing - Sempre ligado</title>
    <link rel="stylesheet" href="/assets/styles/style.css">
    <link rel="stylesheet" href="/assets/styles/dasboard.css">
    <link rel="stylesheet" href="/assets/styles/header.css">
    <link rel="stylesheet" href="/assets/styles/painel.css">
    <link rel="stylesheet" href="/assets/styles/register.css">
 
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const heroTitle = document.querySelector('.pp-hero-left h1');
            if (heroTitle) {
                heroTitle.classList.add('blur-text');
            }
        });
    </script>
</head>

<body class="theme-promoping">
    <header class="pp-header" style="
        background: #1e121433;
        border-radius: 32px;
        margin: 90px auto 0 auto;
        max-width: 1150px;
        box-shadow: 0 2px 16px 0 rgba(0,0,0,0.10);
        border: 2px solid #ffffffb7;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        left: 0;
        right: 0;
        top: 30px;
        transform: none;
        ">
        
        <div style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 64px;
            width: 100%;
            max-width: 900px;
        ">
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="/assets/images/Logo.png" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
                <span style="color: #fff; font-size: 1.1rem; font-weight: 600; letter-spacing: 0.5px;">PromoPing</span>
            </div>
            <nav style="display: flex; align-items: center; gap: 24px;">
                <a href="Login.html" style="color: #fff; font-size: 0.98rem; font-weight: 600; text-decoration: none; opacity: 0.85; transition: opacity 0.2s;">Entrar</a>
                <a href="index.html" style="color: #fff; font-size: 0.98rem; font-weight: 600; text-decoration: none; opacity: 0.85; transition: opacity 0.2s;">Voltar</a>
            </nav>
        </div>
    </header>
