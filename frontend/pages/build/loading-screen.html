<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A optimizar - PromoPing</title>
    <link rel="icon" type="image/png" href="assets/images/PromoPing.png">
    <link rel="stylesheet" href="assets/styles/loading-screen.css">
</head>
<body>
    <div class="loading-container">
        <div class="logo-wrapper">
            <img src="assets/images/PromoPing.png" alt="PromoPing Logo" class="logo" id="logo">
        </div>
        <div class="loading-text" id="loadingText">A libertar memória e a optimizar o site...</div>
        <div class="loading-subtext" id="loadingSubtext">Isto só acontece quando o browser fica sobrecarregado.</div>
    </div>

    <script>
        (function () {
            "use strict";

            const params = new URLSearchParams(window.location.search);
            const returnTo = params.get("returnTo");
            const safeReturnTo =
                returnTo &&
                returnTo.startsWith("/") &&
                !returnTo.includes("loading-screen.html")
                    ? returnTo
                    : "/index.html";

            const CONFIG = {
                minLoadingTime: 1200,
                redirectDelay: 300,
                targetUrl: window.location.origin + safeReturnTo,
            };

            function clearCache() {
                try {
                    if ("caches" in window) {
                        caches.keys().then((names) => {
                            names.forEach((name) => caches.delete(name));
                        });
                    }
                } catch (error) {
                    console.warn("Erro ao limpar cache:", error);
                }
            }

            function clearServiceWorkers() {
                try {
                    if ("serviceWorker" in navigator) {
                        navigator.serviceWorker.getRegistrations().then((registrations) => {
                            registrations.forEach((registration) => registration.unregister());
                        });
                    }
                } catch (error) {
                    console.warn("Erro ao limpar service workers:", error);
                }
            }

            function clearHeavySessionData() {
                try {
                    sessionStorage.removeItem("pp_memory_reload_reason");
                } catch (_) {}
            }

            function addCacheBuster(url) {
                const separator = url.includes("?") ? "&" : "?";
                return url + separator + "_mem=" + Date.now();
            }

            function init() {
                const startTime = Date.now();
                clearCache();
                clearServiceWorkers();
                clearHeavySessionData();

                const logo = document.getElementById("logo");
                if (logo) {
                    logo.src = addCacheBuster(logo.src);
                }

                function proceed() {
                    const elapsed = Date.now() - startTime;
                    const remaining = Math.max(0, CONFIG.minLoadingTime - elapsed);

                    setTimeout(function () {
                        window.location.replace(addCacheBuster(CONFIG.targetUrl));
                    }, remaining + CONFIG.redirectDelay);
                }

                if (document.readyState === "complete") {
                    proceed();
                } else {
                    window.addEventListener("load", proceed);
                }

                setTimeout(function () {
                    if (window.location.pathname.includes("loading-screen.html")) {
                        window.location.replace(addCacheBuster(CONFIG.targetUrl));
                    }
                }, 5000);
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
