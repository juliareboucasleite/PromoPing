<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - PromoPing</title>
    <link rel="icon" type="image/png" href="../assets/images/PromoPing.png">
    
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-810832454"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-810832454');
  </script>
  <link rel="stylesheet" href="../assets/styles/login-redirect.css">
</head>
<body>
    <div class="loading">
        <p>Redirecting...</p>
    </div>
    <script>
        // Get parameters from current URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const description = urlParams.get('description');
        const details = urlParams.get('details');

        // Build redirect URL to index.html
        const redirectUrl = new URL('/index.html', window.location.origin);

        // Add error parameters if they exist
        if (error) {
            redirectUrl.searchParams.set('error', error);
        }
        if (description) {
            redirectUrl.searchParams.set('description', description);
        }
        if (details) {
            redirectUrl.searchParams.set('details', details);
        }

        // Redirect immediately
        window.location.href = redirectUrl.toString();
    </script>
</body>
</html>
