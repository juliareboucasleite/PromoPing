<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando - PromoPing</title>
    <link rel="icon" type="image/png" href="../assets/images/PromoPing.png">
    <style>
        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
        }
        .loading {
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="loading">
        <p>Redirecionando...</p>
    </div>
    <script>
        // Obter parâmetros da URL atual
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const description = urlParams.get('description');
        const details = urlParams.get('details');
        
        // Construir URL de redirecionamento para index.html
        const redirectUrl = new URL('/index.html', window.location.origin);
        
        // Adicionar parâmetros de erro se existirem
        if (error) {
            redirectUrl.searchParams.set('error', error);
        }
        if (description) {
            redirectUrl.searchParams.set('description', description);
        }
        if (details) {
            redirectUrl.searchParams.set('details', details);
        }
        
        // Redirecionar imediatamente
        window.location.href = redirectUrl.toString();
    </script>
</body>
</html>
