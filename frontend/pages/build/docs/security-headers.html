<!-- 
CONFIGURAÇÃO DE SEGURANÇA PARA DOCUMENTAÇÃO PROMOPING

Este arquivo contém as configurações de segurança recomendadas para o servidor.
Aplique estes headers HTTP para proteger contra ataques XSS, clickjacking e outros.

=== HEADERS HTTP RECOMENDADOS ===

1. Content Security Policy (CSP)
   Content-Security-Policy: default-src 'self'; 
                           script-src 'self' 'unsafe-inline'; 
                           style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                           font-src 'self' https://fonts.gstatic.com; 
                           img-src 'self' data:; 
                           connect-src 'self'; 
                           object-src 'none'; 
                           frame-ancestors 'none'; 
                           base-uri 'self'; 
                           form-action 'self';

2. X-Frame-Options
   X-Frame-Options: DENY

3. X-Content-Type-Options
   X-Content-Type-Options: nosniff

4. Referrer Policy
   Referrer-Policy: strict-origin-when-cross-origin

5. Permissions Policy
   Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=()

=== CONFIGURAÇÃO PARA DIFERENTES SERVIDORES ===

NGINX:
location /docs/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()";
}

APACHE (.htaccess):
<IfModule mod_headers.c>
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
</IfModule>

NODE.JS (Express):
app.use((req, res, next) => {
    res.setHeader('Content-Security-Policy', "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';");
    res.setHeader('X-Frame-Options', 'DENY');
    res.setHeader('X-Content-Type-Options', 'nosniff');
    res.setHeader('Referrer-Policy', 'strict-origin-when-cross-origin');
    res.setHeader('Permissions-Policy', 'camera=(), microphone=(), geolocation=(), payment=()');
    next();
});

=== MEDIDAS ADICIONAIS DE SEGURANÇA ===

1. VALIDAÇÃO DE INPUT
   - Todos os inputs são sanitizados antes do processamento
   - Escape HTML em todos os outputs
   - Validação de comprimento e formato

2. PROTEÇÃO CONTRA XSS
   - Uso de textContent em vez de innerHTML quando possível
   - Escape de caracteres especiais em regex
   - Sanitização de queries de pesquisa

3. PROTEÇÃO CONTRA INJEÇÃO
   - Não uso de eval() ou Function()
   - Validação de URLs antes de navegação
   - Escape de caracteres em regex

4. ACESSIBILIDADE E SEGURANÇA
   - Atributos ARIA apropriados
   - Navegação por teclado
   - Foco visível e lógico

=== TESTES DE SEGURANÇA RECOMENDADOS ===

1. Teste de XSS:
   - Inserir <script>alert('XSS')</script> na pesquisa
   - Inserir javascript:alert('XSS') em links
   - Testar com payloads de XSS conhecidos

2. Teste de Injeção:
   - Tentar inserir SQL injection na pesquisa
   - Testar com caracteres especiais: <>&"'
   - Verificar escape de caracteres Unicode

3. Teste de CSP:
   - Verificar se scripts inline são bloqueados
   - Testar carregamento de recursos externos
   - Validar headers de segurança

=== MONITORIZAÇÃO ===

1. Logs de Segurança:
   - Registrar tentativas de XSS
   - Monitorizar queries suspeitas
   - Alertar sobre violações de CSP

2. Métricas:
   - Número de pesquisas por minuto
   - Queries bloqueadas por CSP
   - Tentativas de acesso malicioso
