    <script>
        (function() {
            const form = document.getElementById('registerForm');
            const nameEl = document.getElementById('regName');
            const emailEl = document.getElementById('regEmail');
            const passEl = document.getElementById('regPassword');
            const msgEl = document.getElementById('regMsg');
            const githubBtn = document.getElementById('githubLoginBtn');
            const googleBtn = document.getElementById('googleLoginBtn');
            const API = (localStorage.getItem('PROMOPING_API') || 'http://localhost:3000').replace(/\/+$/, '');

            // Login com GitHub
            if (githubBtn) {
                githubBtn.addEventListener('click', () => {
                    window.location.href = `${API}/api/auth/github`;
                });
            }

            // Login com Google
            if (googleBtn) {
                googleBtn.addEventListener('click', () => {
                    window.location.href = `${API}/api/auth/google`;
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                msgEl.classList.remove('text-danger', 'text-success');
                msgEl.style.display = 'none';
                try {
                    const resp = await fetch(`${API}/api/auth/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            nome: nameEl.value.trim(),
                            email: emailEl.value.trim(),
                            password: passEl.value
                        })
                    });
                    const data = await resp.json();
                    if (!resp.ok || data.status !== 'ok') {
                        throw new Error(data?.error || 'Falha ao registar');
                    }
                    msgEl.classList.add('text-success');
                    msgEl.textContent = 'Conta criada! Verifique seu email para ativar a conta.';
                    msgEl.style.display = 'block';
                } catch (err) {
                    msgEl.classList.add('text-danger');
                    msgEl.textContent = err.message || 'Erro ao registar';
                    msgEl.style.display = 'block';
                }
            });
        })();
    </script>
