<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/promoping/PromoPing.png">
    <link rel="icon" type="image/png" href="../assets/img/promoping/PromoPing.png">
    <title>PromoPing</title>
    <!--     Fonts and icons     -->
    <!-- Fontes locais - removidas referências externas -->
    <!-- Nucleo Icons -->
    <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
    <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
    <!-- Font Awesome Icons - usando versão local se disponível -->
    <!-- CSS Files -->
    <link id="pagestyle" href="../assets/css/soft-ui-dashboard.css?v=1.1.0" rel="stylesheet" />
    <!-- Analytics removido - usando apenas recursos locais do PromoPing -->
</head>

<body class="">
    <div class="container position-sticky z-index-sticky top-0">
        <div class="row">
            <div class="col-12">
                <!-- Navbar -->
                <nav class="navbar navbar-expand-lg blur blur-rounded top-0 z-index-3 shadow position-absolute my-3 py-2 start-0 end-0 mx-4">
                    <div class="container-fluid pe-0">
                        <a class="navbar-brand font-weight-bolder ms-lg-0 ms-3 ">
                            PromoPing
                        </a>
                        <button class="navbar-toggler shadow-none ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon mt-2">
                                <span class="navbar-toggler-bar bar1"></span>
                                <span class="navbar-toggler-bar bar2"></span>
                                <span class="navbar-toggler-bar bar3"></span>
                            </span>
                        </button>
                        <div class="collapse navbar-collapse" id="navigation">
                            <ul class="navbar-nav mx-auto ms-xl-auto me-xl-7">
                            </ul>
                        </div>
                    </div>
                </nav>
                <!-- End Navbar -->
            </div>
        </div>
    </div>
    <main class="main-content  mt-0">
        <section>
            <div class="page-header min-vh-75">
                <div class="container">
                    <div class="row">
                        <div class="col-xl-4 col-lg-5 col-md-6 d-flex flex-column mx-auto">
                            <div class="card card-plain mt-8">
                                <div class="card-header pb-0 text-left bg-transparent">
                                    <h3 class="font-weight-bolder text-info text-gradient">Welcome back</h3>
                                    <p class="mb-0">Enter your email and password to sign in</p>
                                </div>
                                <div class="card-body">
                                    <form role="form" id="loginForm">
                                        <label>Email</label>
                                        <div class="mb-3">
                                            <input id="loginEmail" type="email" class="form-control" placeholder="Email" aria-label="Email" aria-describedby="email-addon" required>
                                        </div>
                                        <label>Password</label>
                                        <div class="mb-3">
                                            <input id="loginPassword" type="password" class="form-control" placeholder="Password" aria-label="Password" aria-describedby="password-addon" required>
                                        </div>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="rememberMe" checked="">
                                            <label class="form-check-label" for="rememberMe">Remember me</label>
                                        </div>
                                        <div class="text-center">
                                            <button id="loginBtn" type="submit" class="btn bg-gradient-info w-100 mt-4 mb-0">Sign in</button>
                                            <a id="resendVerify" href="#" class="d-block text-xs mt-2">Reenviar verificação por email</a>
                                            <div id="loginError" class="text-danger text-sm mt-2" style="display:none"></div>
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center pt-0 px-lg-2 px-1">
                                    <!-- Registro removido do painel administrativo -->
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="oblique position-absolute top-0 h-100 d-md-block d-none me-n8">
                                <div class="oblique-image bg-cover position-absolute fixed-top ms-auto h-100 z-index-0 ms-n6" style="background-image:url('../assets/img/curved-images/curved6.jpg')"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="../assets/js/core/popper.min.js"></script>
    <script src="../assets/js/core/bootstrap.min.js"></script>
    <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
    <script src="../assets/js/plugins/smooth-scrollbar.min.js"></script>
    <script src="../assets/js/promoping-admin.js"></script>
    <script>
        var win = navigator.platform.indexOf('Win') > -1;
        if (win && document.querySelector('#sidenav-scrollbar')) {
            var options = {
                damping: '0.5'
            }
            Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
        }
    </script>
    <script>
        // Handler de login
        (function() {
            const form = document.getElementById('loginForm');
            const emailEl = document.getElementById('loginEmail');
            const passEl = document.getElementById('loginPassword');
            const errEl = document.getElementById('loginError');
            const API = (localStorage.getItem('PROMOPING_API') || 'http://localhost:3000').replace(/\/+$/, '');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errEl.style.display = 'none';
                errEl.classList.remove('text-success');
                errEl.classList.add('text-danger');

                // Validação básica
                if (!emailEl.value.trim()) {
                    errEl.textContent = 'Por favor, informe seu email.';
                    errEl.style.display = 'block';
                    return;
                }
                if (!passEl.value) {
                    errEl.textContent = 'Por favor, informe sua senha.';
                    errEl.style.display = 'block';
                    return;
                }

                try {
                    console.log('[Login] Tentando fazer login...', {
                        email: emailEl.value.trim(),
                        api: API
                    });

                    const resp = await fetch(`${API}/api/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Admin-Panel': 'true' // Marcar que é requisição do Painel Administrativo
                        },
                        body: JSON.stringify({
                            email: emailEl.value.trim(),
                            password: passEl.value
                        })
                    });

                    console.log('[Login] Resposta recebida:', {
                        status: resp.status,
                        ok: resp.ok
                    });

                    let data;
                    try {
                        data = await resp.json();
                    } catch (parseErr) {
                        console.error('[Login] Erro ao parsear JSON:', parseErr);
                        throw new Error('Erro ao comunicar com o servidor. Verifique se o servidor está rodando em ' + API);
                    }

                    console.log('[Login] Dados recebidos:', data);

                    if (!resp.ok || data.status !== 'ok' || !data.token) {
                        // Verificar se foi acesso negado por não ser admin
                        if (data.accessDenied) {
                            throw new Error('Acesso negado. Apenas administradores podem acessar o painel administrativo.');
                        }
                        // Verificar se precisa verificar email
                        if (data.needsVerification) {
                            throw new Error('Email não verificado. Verifique seu email antes de fazer login.');
                        }
                        // Verificar se conta está expirada
                        if (data.accountExpired) {
                            throw new Error('Sua conta foi desativada há mais de 20 dias e foi permanentemente excluída. Entre em contato com o suporte.');
                        }
                        throw new Error(data?.error || 'Email ou senha incorretos');
                    }

                    // Verificar se o usuário retornado é admin (PerfilId = 1)
                    if (data.user && data.user.perfilId !== 1) {
                        throw new Error('Acesso negado. Apenas administradores podem acessar o painel administrativo.');
                    }

                    // Salvar token e redirecionar
                    console.log('[Login] Login bem-sucedido! Usuário admin:', data.user);
                    localStorage.setItem('PROMOPING_TOKEN', data.token);

                    // Obter URL de redirecionamento
                    const qp = new URLSearchParams(window.location.search);
                    let back = qp.get('back');

                    // Se não houver parâmetro 'back', usar caminho absoluto para o dashboard
                    if (!back) {
                        // Construir caminho absoluto baseado na estrutura do projeto
                        const currentPath = window.location.pathname;
                        const basePath = currentPath.substring(0, currentPath.lastIndexOf('/pages'));
                        back = basePath + '/pages/dashboard.html';
                    }

                    console.log('[Login] Redirecionando para:', back);

                    // Redirecionar após um pequeno delay para garantir que o token foi salvo
                    setTimeout(() => {
                        window.location.href = back;
                    }, 100);
                } catch (err) {
                    console.error('[Login] Erro:', err);
                    let errorMessage = err.message || 'Falha ao autenticar';

                    // Tratar erros de rede
                    if (err.name === 'TypeError' && err.message.includes('fetch')) {
                        errorMessage = 'Não foi possível conectar ao servidor. Verifique se o servidor está rodando em ' + API;
                    }

                    errEl.textContent = errorMessage;
                    errEl.style.display = 'block';
                }
            });

            // Reenviar verificação
            document.getElementById('resendVerify').addEventListener('click', async (e) => {
                e.preventDefault();
                errEl.style.display = 'none';
                if (!emailEl.value) {
                    errEl.textContent = 'Informe o email para reenviar o código.';
                    errEl.style.display = 'block';
                    return;
                }
                try {
                    const resp = await fetch(`${API}/api/auth/reenviar-codigo`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: emailEl.value.trim()
                        })
                    });
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data?.error || 'Falha ao reenviar código');
                    errEl.classList.remove('text-danger');
                    errEl.classList.add('text-success');
                    errEl.textContent = 'Código reenviado! Verifique seu email.';
                    errEl.style.display = 'block';
                } catch (err) {
                    errEl.classList.remove('text-success');
                    errEl.classList.add('text-danger');
                    errEl.textContent = err.message || 'Erro ao reenviar código';
                    errEl.style.display = 'block';
                }
            });
        })();
    </script>
    <!-- GitHub buttons removido - usando apenas recursos locais do PromoPing -->
    <!-- Control Center for Soft Dashboard: parallax effects, scripts for the example pages etc -->
    <script src="../assets/js/soft-ui-dashboard.min.js?v=1.1.0"></script>
</body>

</html>
