<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <title>Changelog | PromoPing Docs</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../../assets/images/PromoPing.png">
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <div class="header-left">
        <div class="logo">
          <img src="../../assets/images/PromoPing.png" alt="PromoPing" class="logo-icon" />
          <a href="/pages/index.html" class="logo-text" style="text-decoration: none; color: inherit;">PromoPing
            Docs</a>
        </div>
      </div>
      <div class="header-right">
        <div class="search-container">
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" placeholder="Perguntar ou pesquisar..." />
            <span class="shortcut">Ctrl K</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="docs-container">

    <!-- SIDEBAR - Carregado dinamicamente de nav.html -->
    <div id="sidebar-nav-placeholder"></div>

    <!-- CONTENT -->
    <main class="content">
      <div class="content-header">
        <h1>Changelog</h1>
        <button class="copy-button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6,9 12,15 18,9"></polyline>
          </svg>
        </button>
      </div>

      <!-- Changelog será carregado dinamicamente do GitHub -->
      <div id="changelog-container">
        <!-- Loading será exibido aqui temporariamente -->
      </div>

      <h2>Legenda</h2>
      <div class="legend">
        <div class="legend-item">
          <span class="version-badge major">MAJOR</span>
          <span>Alterações significativas e novas funcionalidades</span>
        </div>
        <div class="legend-item">
          <span class="version-badge minor">MINOR</span>
          <span>Melhorias e correções menores</span>
        </div>
        <div class="legend-item">
          <span class="version-badge patch">PATCH</span>
          <span>Correções de bugs e pequenas melhorias</span>
        </div>
        <div class="legend-item">
          <span class="version-badge planned">PLANEADO</span>
          <span>Funcionalidades em desenvolvimento</span>
        </div>
      </div>

      <div class="next-card" style="cursor: pointer;" onclick="window.location.href='api-reference.html'">
        <div class="next-content">
          <span class="next-label">Seguinte</span>
          <span class="next-link" style="color: #ffc72d; text-decoration: underline;">Referência da API</span>
        </div>
        <svg class="next-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2">
          <polyline points="9,18 15,12 9,6"></polyline>
        </svg>
      </div>

      <footer>
        <p>Última actualização há 1 dia</p>
      </footer>
    </main>

  </div>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <!-- SCRIPTS -->
  <script src="script.js"></script>
  <script src="changelog.js"></script>
  <script src="search.js"></script>

  <style>
    /* Esconder scrollbar da área de conteúdo principal (main.content) */
    main.content {
      scrollbar-width: none !important;
      /* Firefox */
      -ms-overflow-style: none !important;
      /* IE e Edge */
    }

    main.content::-webkit-scrollbar {
      display: none !important;
      /* Chrome, Safari, Opera */
      width: 0 !important;
      background: transparent !important;
    }

    /* Manter funcionalidade de scroll */
    main.content {
      overflow-y: auto !important;
      overflow-x: hidden !important;
    }

    .changelog-version {
      margin-bottom: 3rem;
      padding: 2rem;
      background: #18181a;
      border-radius: 12px;
      border: 1px solid #232326;
      position: relative;
    }

    .changelog-version.future {
      opacity: 0.7;
      border-style: dashed;
    }

    .changelog-version h2 {
      color: #ffc72d;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

    .version-date {
      color: #ccc;
      font-weight: 400;
      font-size: 1rem;
    }

    .version-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .version-badge.major {
      background: #ff4444;
      color: white;
    }

    .version-badge.minor {
      background: #ff9800;
      color: white;
    }

    .version-badge.patch {
      background: #4caf50;
      color: white;
    }

    .version-badge.initial {
      background: #2196f3;
      color: white;
    }

    .version-badge.planned {
      background: #9c27b0;
      color: white;
    }

    .changelog-version h3 {
      color: #e6e6e6;
      margin-top: 1.5rem;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .changelog-version ul {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .changelog-version li {
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: #18181a;
      border-radius: 8px;
      border: 1px solid #232326;
    }

    .legend-item span:last-child {
      color: #ccc;
      font-size: 0.9rem;
    }
  </style>
</body>

</html>
