  <script>
    // Função para inicializar avaliações
    async function initAvaliacoes() {
      const container = document.getElementById('avaliacoes-container');
      const filterTipo = document.getElementById('filter-tipo').value;
      const filterOrdenar = document.getElementById('filter-ordenar').value;
      const searchTerm = document.getElementById('search-input').value.toLowerCase();

      try {
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span></div><p class="text-sm text-muted mt-3">Carregando avaliações...</p></div>';

        // Buscar avaliações da API
        const avaliacoes = await PromoPingAdmin.fetchJSON('/api/avaliacoes').catch(() => {
          // Se não houver API, usar dados mock para demonstração
          return {
            avaliacoes: [
              {
                id: 1,
                usuario: 'João Silva',
                email: 'joao@example.com',
                tipo: 'positiva',
                nota: 5,
                comentario: 'Excelente serviço! Muito útil para monitorar produtos.',
                data: new Date().toISOString(),
                avatar: '../assets/img/team-1.jpg'
              },
              {
                id: 2,
                usuario: 'Maria Santos',
                email: 'maria@example.com',
                tipo: 'positiva',
                nota: 5,
                comentario: 'Recomendo muito! Interface intuitiva e funcionalidades completas.',
                data: new Date(Date.now() - 86400000).toISOString(),
                avatar: '../assets/img/team-2.jpg'
              },
              {
                id: 3,
                usuario: 'Pedro Oliveira',
                email: 'pedro@example.com',
                tipo: 'neutra',
                nota: 3,
                comentario: 'Bom serviço, mas poderia ter mais funcionalidades.',
                data: new Date(Date.now() - 172800000).toISOString(),
                avatar: '../assets/img/team-3.jpg'
              },
              {
                id: 4,
                usuario: 'Ana Costa',
                email: 'ana@example.com',
                tipo: 'negativa',
                nota: 2,
                comentario: 'Tive alguns problemas com notificações.',
                data: new Date(Date.now() - 259200000).toISOString(),
                avatar: '../assets/img/team-4.jpg'
              }
            ],
            estatisticas: {
              total: 4,
              positivas: 2,
              neutras: 1,
              negativas: 1
            }
          };
        });

        // Processar dados
        let avaliacoesList = avaliacoes.avaliacoes || avaliacoes || [];

        // Aplicar filtros
        if (filterTipo) {
          avaliacoesList = avaliacoesList.filter(a => a.tipo === filterTipo);
        }

        if (searchTerm) {
          avaliacoesList = avaliacoesList.filter(a =>
            a.usuario?.toLowerCase().includes(searchTerm) ||
            a.comentario?.toLowerCase().includes(searchTerm) ||
            a.email?.toLowerCase().includes(searchTerm)
          );
        }

        // Ordenar
        avaliacoesList.sort((a, b) => {
          switch (filterOrdenar) {
            case 'antiga':
              return new Date(a.data) - new Date(b.data);
            case 'melhor':
              return (b.nota || 0) - (a.nota || 0);
            case 'pior':
              return (a.nota || 0) - (b.nota || 0);
            default: // recente
              return new Date(b.data) - new Date(a.data);
          }
        });

        // Atualizar estatísticas
        const stats = avaliacoes.estatisticas || calcularEstatisticas(avaliacoesList);
        document.getElementById('total-avaliacoes').textContent = stats.total || avaliacoesList.length;
        document.getElementById('avaliacoes-positivas').textContent = stats.positivas || avaliacoesList.filter(a => a.tipo === 'positiva').length;
        document.getElementById('avaliacoes-neutras').textContent = stats.neutras || avaliacoesList.filter(a => a.tipo === 'neutra').length;
        document.getElementById('avaliacoes-negativas').textContent = stats.negativas || avaliacoesList.filter(a => a.tipo === 'negativa').length;

        // Renderizar avaliações
        if (avaliacoesList.length === 0) {
          container.innerHTML = '<div class="text-center py-5"><i class="fas fa-star text-muted" style="font-size: 3rem;"></i><p class="text-sm text-muted mt-3">Nenhuma avaliação encontrada.</p></div>';
          return;
        }

        container.innerHTML = avaliacoesList.map(av => {
          const dataFormatada = new Date(av.data).toLocaleDateString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          const tipoClass = {
            'positiva': 'success',
            'neutra': 'warning',
            'negativa': 'danger'
          }[av.tipo] || 'secondary';

          const tipoIcon = {
            'positiva': 'thumbs-up',
            'neutra': 'minus',
            'negativa': 'thumbs-down'
          }[av.tipo] || 'star';

          const estrelas = Array(5).fill(0).map((_, i) =>
            i < (av.nota || 0) ? '<i class="fas fa-star text-warning"></i>' : '<i class="far fa-star text-muted"></i>'
          ).join('');

          return `
            <div class="card mb-3 border-start border-${tipoClass} border-4">
              <div class="card-body">
                <div class="d-flex">
                  <div class="me-3">
                    <img src="${av.avatar || '../assets/img/team-1.jpg'}" alt="${av.usuario}" class="avatar avatar-sm rounded-circle">
                  </div>
                  <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                      <div>
                        <h6 class="mb-0">${av.usuario || 'Usuário'}</h6>
                        <p class="text-xs text-muted mb-0">${av.email || ''}</p>
                      </div>
                      <div class="text-end">
                        <span class="badge bg-gradient-${tipoClass} mb-2">
                          <i class="fas fa-${tipoIcon} me-1"></i>
                          ${av.tipo === 'positiva' ? 'Positiva' : av.tipo === 'negativa' ? 'Negativa' : 'Neutra'}
                        </span>
                        <div class="text-xs text-muted">${dataFormatada}</div>
                      </div>
                    </div>
                    <div class="mb-2">${estrelas}</div>
                    <p class="text-sm mb-0">${av.comentario || 'Sem comentário'}</p>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (error) {
        console.error('Erro ao carregar avaliações:', error);
        container.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-triangle me-2"></i>Erro ao carregar avaliações. Tente novamente.</div>';
      }
    }

    function calcularEstatisticas(avaliacoes) {
      return {
        total: avaliacoes.length,
        positivas: avaliacoes.filter(a => a.tipo === 'positiva').length,
        neutras: avaliacoes.filter(a => a.tipo === 'neutra').length,
        negativas: avaliacoes.filter(a => a.tipo === 'negativa').length
      };
    }

    function limparFiltros() {
      document.getElementById('filter-tipo').value = '';
      document.getElementById('filter-ordenar').value = 'recente';
      document.getElementById('search-input').value = '';
      initAvaliacoes();
    }

    // Event listeners
    document.getElementById('filter-tipo').addEventListener('change', initAvaliacoes);
    document.getElementById('filter-ordenar').addEventListener('change', initAvaliacoes);
    document.getElementById('search-input').addEventListener('input', initAvaliacoes);

    // Inicializar ao carregar a página
    document.addEventListener('DOMContentLoaded', function () {
      initAvaliacoes();
    });
  </script>
  <script src="../assets/js/soft-ui-dashboard.min.js"></script>
</body>

</html>
